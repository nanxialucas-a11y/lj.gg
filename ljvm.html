<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ljVM — lj.gg</title>
    <link rel="icon" href="../favicon.ico?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/music-player.css">
    <style>
        :root {
            --cream: #f2ecd6;
            --ink: #2b2115;
            --olive: #47542f;
            --clay: #a68a5b;
            --muted: #6b5d4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; }

        :focus-visible {
            outline: 2px solid var(--olive);
            outline-offset: 3px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px clamp(24px, 6vw, 64px);
            border-bottom: 1px solid rgba(71, 84, 47, 0.18);
            flex-shrink: 0;
        }

        nav .back {
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        nav .back:hover { color: var(--olive); }

        nav .wordmark {
            font-family: 'Lora', serif;
            font-weight: 600;
            font-style: italic;
            font-size: 18px;
            color: var(--olive);
        }

        .vm-wrap {
            flex: 1;
            padding: clamp(12px, 2vw, 24px);
            display: flex;
        }

        .vm-frame {
            flex: 1;
            border: 1px solid rgba(71, 84, 47, 0.25);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(71, 84, 47, 0.12);
        }

        .vm-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .vm-status {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--muted);
        }

        .vm-status.error {
            color: #a03c2d;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/home.html" class="back">← back to hub</a>
        <span class="wordmark">ljVM</span>
    </nav>

    <div class="vm-wrap">
        <div class="vm-frame" id="vm-frame">
            <div class="vm-status" id="vm-status">spinning up a fresh session...</div>
        </div>
    </div>

    <script>
        // Points at your ljvm-launcher Cloudflare Worker — swap in its real
        // URL once deployed (workers.dev URL or your bound custom domain).
        const LAUNCHER_URL = "https://ljvmlauncher.nanxia-lucas.workers.dev/";

        const frame = document.getElementById("vm-frame");
        const status = document.getElementById("vm-status");

        fetch(LAUNCHER_URL)
            .then(res => {
                if (!res.ok) throw new Error("launcher returned " + res.status);
                return res.json();
            })
            .then(data => {
                if (!data.embed_url) throw new Error("no embed_url in response");
                const iframe = document.createElement("iframe");
                iframe.src = data.embed_url;
                iframe.allow = "clipboard-read; clipboard-write; autoplay; camera; microphone";
                iframe.allowFullscreen = true;
                frame.innerHTML = "";
                frame.appendChild(iframe);
            })
            .catch(err => {
                status.textContent = "couldn't start a session: " + err.message;
                status.classList.add("error");
            });
    </script>

</body>
</html>
