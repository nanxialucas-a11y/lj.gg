<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ljVM — lj.gg</title>
    <link rel="icon" href="../favicon.ico?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/music-player.css">
    <style>
        :root {
            --cream: #f2ecd6;
            --ink: #2b2115;
            --olive: #47542f;
            --clay: #a68a5b;
            --muted: #6b5d4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; }

        :focus-visible {
            outline: 2px solid var(--olive);
            outline-offset: 3px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px clamp(24px, 6vw, 64px);
            border-bottom: 1px solid rgba(71, 84, 47, 0.18);
            flex-shrink: 0;
        }

        nav .back {
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        nav .back:hover { color: var(--olive); }

        nav .wordmark {
            font-family: 'Lora', serif;
            font-weight: 600;
            font-style: italic;
            font-size: 18px;
            color: var(--olive);
        }

        .vm-wrap {
            flex: 1;
            padding: clamp(12px, 2vw, 24px);
            display: flex;
        }

        .vm-frame {
            flex: 1;
            border: 1px solid rgba(71, 84, 47, 0.25);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(71, 84, 47, 0.12);
        }

        .vm-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/home.html" class="back">← back to hub</a>
        <span class="wordmark">ljVM</span>
    </nav>

    <div class="vm-wrap">
        <div class="vm-frame">
            <iframe
                src="https://99bm9nm9jpuszfdowclwzn9gf.hyperbeam.com/--tbj5PhTReWoecjxO3cQg?token=SvSc5cMxY9-maXeS0g5X4oN1u-grcJFUB_522qPmy6A"
                allow="clipboard-read; clipboard-write; autoplay; camera; microphone"
                allowfullscreen
            ></iframe>
        </div>
    </div>

</body>
</html>
