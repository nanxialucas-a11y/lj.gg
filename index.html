<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the hub entrance</title>
    <link rel="icon" href="favicon.ico?v=3">
    <link rel="stylesheet" href="/music-player.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            background: #f2ecd6;
            color: #3a2f22;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .card {
            text-align: center;
            padding: 40px;
            border-radius: 16px;
            background: rgba(71, 84, 47, 0.08);
            border: 1px solid rgba(71, 84, 47, 0.3);
            box-shadow: 0 0 25px rgba(71, 84, 47, 0.2);
        }

        h1 {
            font-size: 48px;
            margin: 0;
            letter-spacing: 2px;
            color: #47542f;
            text-shadow: 0 0 10px rgba(71, 84, 47, 0.6);
        }

        p {
            margin-top: 10px;
            color: #6b5d4a;
            font-size: 18px;
        }

        button {
            margin-top: 25px;
            padding: 10px 18px;
            border: 1px solid #47542f;
            border-radius: 8px;
            background: transparent;
            color: #47542f;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        button:hover {
            background: #47542f;
            color: #f2ecd6;
            transform: scale(1.05);
            box-shadow: 0 0 15px #47542f;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>welcome to the hub's entrance!</h1>
        <p><em>beta release of the hub is out! come check it out</em></p>
        <p>a small website i created which currently features many unblocked games. other features such as a web based proxy will come soon</p>
        <button onclick="window.location.href='home.html'">enter</button>
    </div>
</body>
</html>
