<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lj.gg</title>
    <link rel="icon" href="favicon.ico?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/music-player.css">
    <style>
        :root {
            --cream: #f2ecd6;
            --ink: #2b2115;
            --olive: #47542f;
            --clay: #a68a5b;
            --muted: #6b5d4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;

            background: var(--cream);
            color: var(--ink);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        :focus-visible {
            outline: 2px solid var(--olive);
            outline-offset: 3px;
        }

        .card {
            text-align: left;
            max-width: 420px;
            padding: 44px;
            border-radius: 16px;
            background: rgba(71, 84, 47, 0.06);
            border: 1px solid rgba(71, 84, 47, 0.25);
            box-shadow: 0 0 30px rgba(71, 84, 47, 0.15);
            transition: opacity 0.3s ease;
        }

        p.eyebrow {
            font-size: 13px;
            color: var(--clay);
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Lora', serif;
            font-weight: 600;
            font-style: italic;
            font-size: 38px;
            line-height: 1.1;
            color: var(--olive);
            text-shadow: 0 0 16px rgba(71, 84, 47, 0.35);
            letter-spacing: -0.01em;
        }

        p.lede {
            margin-top: 16px;
            font-size: 15px;
            line-height: 1.6;
            color: var(--muted);
        }

        button {
            margin-top: 28px;
            padding: 11px 20px;
            border: 1px solid var(--olive);
            border-radius: 8px;
            background: transparent;
            color: var(--olive);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            background: var(--olive);
            color: var(--cream);
            box-shadow: 0 0 18px var(--olive);
        }

        .bloom {
            position: fixed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--olive);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.65s cubic-bezier(0.65, 0, 0.35, 1);
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

<body>
    <div class="card" id="card">
        <p class="eyebrow">welcome to</p>
        <h1>lj.gg</h1>
        <p class="lede">previously "the hub" lj.gg is a small website i built with a library of unblocked games, a browser virtual machine and a few other things in progress.</p>
        <button id="enter-btn">enter →</button>
    </div>

    <div class="bloom" id="bloom"></div>

    <script>
        const btn = document.getElementById("enter-btn");
        const card = document.getElementById("card");
        const bloom = document.getElementById("bloom");
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        btn.addEventListener("click", (e) => {
            if (reduceMotion) {
                window.location.href = "home.html";
                return;
            }

            const rect = btn.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            // scale big enough to cover the furthest corner of the viewport
            const maxDist = Math.hypot(
                Math.max(x, window.innerWidth - x),
                Math.max(y, window.innerHeight - y)
            );
            const scale = (maxDist * 2.2) / 40;

            bloom.style.left = x + "px";
            bloom.style.top = y + "px";
            card.style.opacity = "0";

            requestAnimationFrame(() => {
                bloom.style.transform = `translate(-50%, -50%) scale(${scale})`;
            });

            setTimeout(() => {
                window.location.href = "home.html";
            }, 600);
        });
    </script>
</body>
</html>
