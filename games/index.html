<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>games</title>
    <link rel="icon" href="../favicon.ico?v=3">
    <link rel="stylesheet" href="/music-player.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2ecd6;
            color: #3a2f22;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
        }

        nav {
            padding: 20px 40px;
            border-bottom: 1px solid rgba(71, 84, 47, 0.3);
            background: rgba(71, 84, 47, 0.08);
        }

        nav h2 {
            color: #47542f;
            text-shadow: 0 0 10px rgba(71, 84, 47, 0.6);
        }

        main {
            max-width: 1500px;
            margin: auto;
            padding: 40px;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 56px;
            color: #47542f;
            text-shadow: 0 0 15px rgba(71, 84, 47, 0.6);
        }

        .hero p {
            color: #6b5d4a;
            margin-top: 10px;
        }

        .back {
            margin-bottom: 40px;
            display: inline-block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 35px;
        }

        .card {
            background: rgba(71, 84, 47, 0.08);
            border: 1px solid rgba(71, 84, 47, 0.3);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(71, 84, 47, 0.15);
            transition: 0.2s;

            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 30px rgba(71, 84, 47, 0.25);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(71, 84, 47, 0.2);
        }

        .card h2 {
            color: #47542f;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(71, 84, 47, 0.6);
        }

        .card p {
            color: #6b5d4a;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .button {
            display: inline-block;
            margin-top: auto;
            padding: 10px 18px;
            border: 1px solid #47542f;
            border-radius: 8px;
            color: #47542f;
            text-decoration: none;
            transition: 0.2s;
        }

        .button:hover {
            background: #47542f;
            color: #f2ecd6;
            box-shadow: 0 0 15px #47542f;
        }
    </style>
</head>
<body>

    <nav>
        <h2>games</h2>
    </nav>

    <main>

        <a href="/home.html" class="button back">← back to hub</a>

        <section class="hero">
            <h1>games</h1>
            <p>free, unblocked, ad-free games that can be played anywhere</p>
        </section>

        <section class="grid" id="game-grid"></section>

    </main>

            {

                title: "Subway Surfers: Miami",
                desc: "subway surfers miami edition",
                link: "/games/subwaysurfers/",
                buttonText: "play"
            },
            {
                img: "/images/games/bloonstd5.jpg",
                alt: "Bloons TD 5",
                title: "Bloons TD 5",
                desc: "ported flash version of btd5",
                link: "/games/bloonstd5/",
                buttonText: "play"
            },
            {

                alt: "Tiny Fishing",

            },
            {

            {
                img: "/images/games/rocketleaguethumbnail.png",
                alt: "Rocket League",

                desc: "car soccer game",
                link: "/games/rocketleague/",
                buttonText: "play"
            },
            {
                img: "/images/games/gdlitethumbnail.png",
                alt: "Geometry Dash Lite",
                title: "Geometry Dash Lite",
                desc: "a smaller version of geometry dash",
                link: "/games/gdlite/",
                buttonText: "play"
            },
            {
                img: "/images/games/tungsahurhorrorthumbnail.png",
                alt: "Tung Sahur Horror",
                title: "Tung Sahur Horror",
                desc: "retexture of the horror game granny",
                link: "/games/tungsahurhorror/",
                buttonText: "play"
            },
            {
                img: "/images/games/treeshateyouthumbnail.jpg",
                alt: "Trees Hate You",
                title: "Trees Hate You",

                link: "/games/treeshateyou/",

            {

	    {

            {

                link: "/games/fnafsisterlocation/",

            },
            {
                img: "/images/games/bigflappytowertinysquarethumbnail.webp",
                alt: "Big Flappy Tower Tiny Square",
                title: "Big Flappy Tower Tiny Square",
                desc: "an incredibly difficult platformer with a unique flapping mechanic",

            {

            {

                title: "Brawl Stars",
                desc: "brawl stars unity remake",
                link: "/games/brawlstars/",
                buttonText: "play"
            }
        ];

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        function renderGames() {
            const grid = document.getElementById("game-grid");
            grid.innerHTML = games.map(game => `
                <div class="card">
                    <img src="${game.img}" alt="${escapeHtml(game.alt)}">
                    <h2>${escapeHtml(game.title)}</h2>
                    <p>${escapeHtml(game.desc)}</p>
                    <a href="${game.link}" class="button">${escapeHtml(game.buttonText)}</a>
                </div>
            `).join("");
        }

        renderGames();
    </script>

</body>
</html>
