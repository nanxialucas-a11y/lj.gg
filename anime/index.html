<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2ecd6">
    <title>anime</title>
    <link rel="icon" href="/favicon.ico?v=3">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/music-player.css">

    <style>
        :root {
            --cream: #f2ecd6;
            --cream-deep: #e8dfc2;
            --ink: #2b2115;
            --olive: #47542f;
            --olive-deep: #333d22;
            --clay: #a68a5b;
            --muted: #6b5d4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
        }

        button, input, select {
            font: inherit;
        }

        button {
            color: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--olive);
            outline-offset: 3px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px clamp(24px, 6vw, 64px);
            border-bottom: 1px solid rgba(71, 84, 47, 0.18);
        }

        nav .wordmark {
            font-family: 'Lora', serif;
            font-weight: 600;
            font-style: italic;
            font-size: 20px;
            color: var(--olive);
            text-shadow: 0 0 12px rgba(71, 84, 47, 0.35);
            text-decoration: none;
        }

        .nav-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        nav .quicklink {
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            border: 1px solid rgba(71, 84, 47, 0.3);
            padding: 7px 14px;
            border-radius: 999px;
            transition: color 0.15s ease, border-color 0.15s ease;
            background: transparent;
        }

        nav .quicklink:hover {
            color: var(--olive);
            border-color: var(--olive);
        }

        #filterToggle {
            cursor: pointer;
        }

        main {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: clamp(48px, 7vw, 76px) clamp(24px, 6vw, 64px) 40px;
        }

        .hero p.eyebrow {
            font-size: 14px;
            color: var(--clay);
            margin-bottom: 14px;
        }

        .hero h1 {
            font-family: 'Lora', serif;
            font-weight: 600;
            font-style: italic;
            font-size: clamp(40px, 7vw, 58px);
            line-height: 1.05;
            color: var(--olive);
            text-shadow: 0 0 20px rgba(71, 84, 47, 0.3);
            letter-spacing: -0.01em;
        }

        .hero p.lede {
            margin-top: 18px;
            max-width: 46ch;
            font-size: 17px;
            line-height: 1.6;
            color: var(--muted);
        }

        .catalog {
            margin-top: 54px;
        }

        .catalog-heading {
            font-size: 13px;
            color: var(--clay);
            margin-bottom: 4px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 190px;
            gap: 12px;
            margin: 22px 0 30px;
        }

        .search-input,
        .sort-select {
            width: 100%;
            min-width: 0;
            padding: 12px 14px;
            border: 1px solid rgba(71, 84, 47, 0.3);
            border-radius: 0;
            background: transparent;
            color: var(--ink);
            font-size: 13px;
            transition: border-color 0.15s ease;
        }

        .search-input::placeholder {
            color: var(--muted);
            opacity: 0.8;
        }

        .search-input:focus,
        .sort-select:focus {
            border-color: var(--olive);
            outline: none;
        }

        .sort-select {
            cursor: pointer;
        }

        .section-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(71, 84, 47, 0.16);
        }

        .section-heading h2 {
            font-family: 'Lora', serif;
            font-size: 23px;
            font-weight: 600;
        }

        .result-count {
            color: var(--muted);
            font-size: 12px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 28px 20px;
            width: 100%;
            margin-top: 22px;
            align-items: stretch;
        }

        .anime-card {
            display: flex;
            flex-direction: column;
            align-self: stretch;
            min-width: 0;
            width: 100%;
            border: 0;
            border-radius: 0;
            padding: 0;
            background: transparent;
            text-align: left;
            cursor: pointer;
        }

        .poster {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            background: var(--cream-deep);
            border: 1px solid rgba(71, 84, 47, 0.16);
        }

        .poster img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .anime-card:hover .poster img {
            transform: scale(1.035);
        }

        .poster-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px;
            background: var(--cream-deep);
            color: var(--olive);
            text-align: center;
        }

        .poster-placeholder.hidden {
            display: none;
        }

        .placeholder-mark {
            font-family: 'Lora', serif;
            font-size: 40px;
            font-style: italic;
            color: var(--olive);
            opacity: 0.65;
        }

        .placeholder-title {
            font-family: 'Lora', serif;
            font-size: 13px;
            line-height: 1.5;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            padding: 12px 0 13px;
            border-bottom: 1px solid rgba(71, 84, 47, 0.16);
        }

        .card-title {
            display: -webkit-box;
            min-height: 42px;
            overflow: hidden;
            font-family: 'Lora', serif;
            font-size: 16px;
            line-height: 1.4;
            font-weight: 600;
            color: var(--ink);
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            transition: color 0.15s ease;
        }

        .anime-card:hover .card-title {
            color: var(--olive);
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 9px;
        }

        .tag {
            display: inline-block;
            max-width: 100%;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tag.live {
            background: rgba(65, 95, 40, 0.12);
            color: var(--olive);
        }

        .tag.alpha {
            background: rgba(166, 138, 91, 0.2);
            color: var(--clay);
        }

        .tag.soon {
            background: rgba(107, 93, 74, 0.12);
            color: var(--muted);
        }

        .status-panel,
        .empty-state {
            grid-column: 1 / -1;
            padding: 30px 0;
            border-top: 1px solid rgba(71, 84, 47, 0.16);
            border-bottom: 1px solid rgba(71, 84, 47, 0.16);
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: var(--olive);
            font-family: 'Lora', serif;
            font-size: 22px;
            font-weight: 600;
        }

        .action-button {
            padding: 8px 14px;
            border: 1px solid rgba(71, 84, 47, 0.3);
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .action-button:hover:not(:disabled) {
            color: var(--olive);
            border-color: var(--olive);
        }

        .action-button.primary {
            color: var(--olive);
            border-color: var(--olive);
        }

        .action-button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 34px;
        }

        .page-number {
            color: var(--muted);
            font-size: 12px;
        }

        .hidden {
            display: none !important;
        }

        .search-progress {
            grid-column: 1 / -1;
            padding: 22px 0;
            border-top: 1px solid rgba(71, 84, 47, 0.16);
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
        }

        .detail-view {
            margin-top: 12px;
        }

        .detail-topbar {
            margin-bottom: 34px;
        }

        .detail-layout {
            display: grid;
            grid-template-columns: minmax(190px, 270px) minmax(0, 1fr);
            gap: clamp(24px, 4vw, 48px);
            align-items: start;
        }

        .detail-poster {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            background: var(--cream-deep);
            border: 1px solid rgba(71, 84, 47, 0.16);
        }

        .detail-poster img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-copy {
            min-width: 0;
        }

        .detail-copy h1 {
            margin: 0 0 14px;
            font-family: 'Lora', serif;
            font-weight: 600;
            font-style: italic;
            font-size: clamp(30px, 4.5vw, 46px);
            line-height: 1.15;
            color: var(--olive);
            text-shadow: 0 0 16px rgba(71, 84, 47, 0.2);
        }

        .detail-description {
            margin-top: 18px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-line;
        }

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 14px;
        }

        .detail-section {
            margin-top: 48px;
        }

        .detail-section h2 {
            margin-bottom: 18px;
            font-family: 'Lora', serif;
            font-size: 25px;
            font-weight: 600;
        }

        .episode-list {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0 18px;
        }

        .episode-button {
            min-width: 0;
            padding: 16px 0;
            border: 0;
            border-top: 1px solid rgba(71, 84, 47, 0.16);
            border-radius: 0;
            background: transparent;
            color: var(--ink);
            text-align: left;
            cursor: pointer;
        }

        .episode-button:nth-last-child(1) {
            border-bottom: 1px solid rgba(71, 84, 47, 0.16);
        }

        .episode-number {
            display: block;
            margin-bottom: 5px;
            color: var(--clay);
            font-size: 11px;
        }

        .episode-title {
            display: -webkit-box;
            overflow: hidden;
            font-family: 'Lora', serif;
            font-size: 14px;
            line-height: 1.5;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .episode-button:hover .episode-title,
        .episode-button.active .episode-title {
            color: var(--olive);
        }

        .episode-button.active {
            background: rgba(71, 84, 47, 0.06);
        }

        .player-panel {
            margin-top: 46px;
            padding-top: 24px;
            border-top: 1px solid rgba(71, 84, 47, 0.18);
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 18px;
        }

        .player-header h2 {
            font-family: 'Lora', serif;
            font-size: 23px;
            font-weight: 600;
        }

        .language-controls {
            display: flex;
            gap: 8px;
        }

        .language-button {
            padding: 7px 13px;
            border: 1px solid rgba(71, 84, 47, 0.3);
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .language-button:hover,
        .language-button.active {
            color: var(--olive);
            border-color: var(--olive);
        }

        .video-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: var(--ink);
        }

        .video-frame iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 24px;
            color: var(--cream);
            text-align: center;
            font-size: 13px;
            line-height: 1.7;
        }

        .player-note {
            margin-top: 12px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.7;
        }

        footer {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 24px 50px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--muted);
        }

        @media (max-width: 1100px) {
            .anime-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .episode-list {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 780px) {
            main {
                padding-top: 48px;
            }

            .anime-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 24px 16px;
            }

            .detail-layout {
                grid-template-columns: minmax(150px, 220px) minmax(0, 1fr);
                gap: 24px;
            }

            .episode-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 540px) {
            nav {
                padding: 18px 22px;
            }

            nav .quicklink {
                font-size: 11px;
                padding: 7px 10px;
            }

            main {
                padding: 42px 22px 30px;
            }

            .hero h1 {
                font-size: clamp(38px, 10vw, 50px);
            }

            .hero p.lede {
                font-size: 15px;
            }

            .toolbar {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .anime-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 24px 14px;
            }

            .card-title {
                font-size: 15px;
            }

            .detail-layout {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .detail-poster {
                max-width: 220px;
            }

            .detail-copy h1 {
                font-size: 34px;
            }

            .detail-section {
                margin-top: 38px;
            }

            .episode-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0 14px;
            }

            .pagination {
                gap: 10px;
            }

            footer {
                padding: 24px 22px 40px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }

        .bloom-arrival {
            position: fixed;
            inset: 0;
            background: var(--olive);
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.45s ease;
        }

        .bloom-arrival.fade-out {
            opacity: 0;
        }

        .section-heading h2 {
            color: #47542f;
        }
    </style>
</head>

<body>
    <div class="bloom-arrival" id="bloom-arrival"></div>

    <nav>
        <a href="/home.html" class="wordmark">lj.gg</a>
        <div class="nav-controls">
            <a href="/home.html" class="quicklink">← back to home</a>

            <span
                class="quicklink"
                title="The content filter stays on."
                aria-label="Content filter is always on"
            >
                filter: on
            </span>
        </div>
    </nav>

    <main>
        <section id="catalogView">
            <section class="hero">
                <p class="eyebrow">anime</p>
                <h1>something to<br>watch.</h1>
                <p class="lede">an anime library free forever and adless. browse around and see what you discover.</p>
            </section>

            <section class="catalog">
                <p class="catalog-heading">the collection</p>

                <div class="toolbar">
                    <input
                        id="searchInput"
                        class="search-input"
                        type="search"
                        placeholder="search anime..."
                        aria-label="Search anime"
                        autocomplete="off"
                    >

                    <select id="sortSelect" class="sort-select" aria-label="Sort anime">
                        <option value="default">recently added</option>
                        <option value="title-asc">title: A–Z</option>
                        <option value="title-desc">title: Z–A</option>
                    </select>
                </div>

                <div class="section-heading">
                    <h2>all anime</h2>
                    <span id="resultCount" class="result-count">loading...</span>
                </div>

                <div id="animeGrid" class="anime-grid" aria-live="polite">
                    <div class="status-panel">loading the catalogue...</div>
                </div>

                <div class="pagination" id="pagination">
                    <button id="prevButton" class="action-button" disabled>← previous</button>
                    <span id="pageNumber" class="page-number">page 1</span>
                    <button id="nextButton" class="action-button" disabled>next →</button>
                </div>
            </section>
        </section>

        <section id="detailView" class="detail-view hidden">
            <div class="detail-topbar">
                <button id="backToCatalog" class="action-button">← back to anime</button>
            </div>

            <div id="detailContent">
                <div class="status-panel">loading series...</div>
            </div>
        </section>
    </main>

    <footer style="text-align: center;">
        © 2026 Lucas Jiang. Contact me at nanxia.lucas@gmail.com.
    </footer>

    <script src="/music-player.js"></script>

    <script>
        "use strict";

        const ANILIST_API = "https://graphql.anilist.co";
        const MEGAPLAY_BASE = "https://megaplay.buzz/stream/mal";
        const PER_PAGE = 20;
        const REQUEST_RETRIES = 3;
        const REQUEST_BACKOFF_MS = 700;
        const SEARCH_DEBOUNCE_MS = 350;

        const catalogView = document.getElementById("catalogView");
        const detailView = document.getElementById("detailView");
        const animeGrid = document.getElementById("animeGrid");
        const resultCount = document.getElementById("resultCount");
        const pageNumber = document.getElementById("pageNumber");
        const prevButton = document.getElementById("prevButton");
        const nextButton = document.getElementById("nextButton");
        const pagination = document.getElementById("pagination");
        const searchInput = document.getElementById("searchInput");
        const sortSelect = document.getElementById("sortSelect");
        const detailContent = document.getElementById("detailContent");
        const bloomArrival = document.getElementById("bloom-arrival");

        let currentPage = 1;
        let hasNextPage = false;
        let currentAnime = [];
        let selectedSeries = null;
        let selectedEpisode = null;
        let selectedLanguage = "sub";
        let searchTimer = null;
        let catalogRequestId = 0;
        let detailRequestId = 0;
        let lastOpenedSeriesId = null;
        const mediaCache = new Map();

        const MEDIA_FIELDS = `
            id
            idMal
            title {
                romaji
                english
                native
                userPreferred
            }
            coverImage {
                extraLarge
                large
                medium
            }
            description(asHtml: false)
            episodes
            genres
            format
            status
            averageScore
            startDate {
                year
            }
            isAdult
            tags {
                name
                isAdult
                rank
            }
        `;

        const SEARCH_QUERY = `
            query AnimePage($page: Int!, $perPage: Int!, $search: String) {
                Page(page: $page, perPage: $perPage) {
                    pageInfo {
                        currentPage
                        hasNextPage
                    }
                    media(
                        type: ANIME
                        isAdult: false
                        genre_not_in: ["Hentai", "Ecchi"]
                        search: $search
                        sort: [UPDATED_AT_DESC, POPULARITY_DESC]
                    ) {
                        ${MEDIA_FIELDS}
                    }
                }
            }
        `;

        const DETAIL_QUERY = `
            query AnimeDetail($id: Int!) {
                Media(
                    id: $id
                    type: ANIME
                    isAdult: false
                    genre_not_in: ["Hentai", "Ecchi"]
                ) {
                    ${MEDIA_FIELDS}
                }
            }
        `;

        if (bloomArrival) {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => bloomArrival.classList.add("fade-out"));
            });
            bloomArrival.addEventListener("transitionend", () => bloomArrival.remove());
            setTimeout(() => bloomArrival.remove(), 700);
        }

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        function firstValue(...values) {
            return values.find(value =>
                value !== undefined &&
                value !== null &&
                String(value).trim() !== ""
            );
        }

        function getTitle(anime) {
            return String(firstValue(
                anime?.title?.english,
                anime?.title?.userPreferred,
                anime?.title?.romaji,
                anime?.title?.native,
                "untitled anime"
            ));
        }

        function getAnimeId(anime) {
            return anime?.id == null ? "" : String(anime.id);
        }

        function getMalId(anime) {
            const id = Number(anime?.idMal);
            return Number.isSafeInteger(id) && id > 0 ? id : null;
        }

        function getPoster(anime) {
            return String(firstValue(
                anime?.coverImage?.extraLarge,
                anime?.coverImage?.large,
                anime?.coverImage?.medium,
                ""
            ));
        }

        function getGenres(anime) {
            return Array.isArray(anime?.genres)
                ? anime.genres.filter(genre => typeof genre === "string")
                : [];
        }

        function isSuitable(anime) {
            if (!anime || anime.isAdult === true) return false;

            const blockedGenres = new Set([
                "hentai", "ecchi", "erotica", "adult"
            ]);

            const genres = getGenres(anime).map(genre => genre.trim().toLowerCase());
            if (genres.some(genre => blockedGenres.has(genre))) return false;

            const tags = Array.isArray(anime.tags) ? anime.tags : [];
            if (tags.some(tag =>
                tag?.isAdult === true ||
                blockedGenres.has(String(tag?.name || "").trim().toLowerCase())
            )) return false;

            return true;
        }

        function getDescription(series) {
            const description = String(
                series?.description || "no description is available for this series yet."
            );

            // AniList descriptions may contain markup. Remove tags before displaying as text.
            return description
                .replace(/<[^>]*>/g, " ")
                .replace(/\s+/g, " ")
                .trim() || "no description is available for this series yet.";
        }

        function getEpisodeCount(series) {
            const count = Number(series?.episodes);
            return Number.isInteger(count) && count > 0 ? Math.min(count, 500) : 0;
        }

        function makeEpisodes(series) {
            const count = getEpisodeCount(series);
            return Array.from({ length: count }, (_, index) => ({
                number: index + 1,
                title: `episode ${index + 1}`
            }));
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function fetchGraphQL(query, variables, { retries = REQUEST_RETRIES } = {}) {
            let lastError;

            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const response = await fetch(ANILIST_API, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({ query, variables })
                    });

                    if (response.ok) {
                        const payload = await response.json();
                        if (Array.isArray(payload.errors) && payload.errors.length) {
                            throw new Error(payload.errors.map(item => item.message).join("; "));
                        }
                        return payload.data;
                    }

                    const retryable = response.status === 429 || response.status >= 500;
                    if (!retryable || attempt === retries) {
                        throw new Error(`AniList request failed (${response.status})`);
                    }

                    const retryAfter = Number(response.headers.get("Retry-After"));
                    const waitMs = retryAfter > 0
                        ? Math.min(retryAfter * 1000, 10000)
                        : REQUEST_BACKOFF_MS * Math.pow(2, attempt);

                    await sleep(waitMs);
                } catch (error) {
                    lastError = error;

                    const retryable =
                        error instanceof TypeError ||
                        /temporarily|network|failed to fetch/i.test(error?.message || "");

                    if (!retryable || attempt === retries) throw error;

                    await sleep(REQUEST_BACKOFF_MS * Math.pow(2, attempt));
                }
            }

            throw lastError || new Error("AniList request failed.");
        }

        function getSortedAnime(list) {
            const sorted = [...list];
            const sort = sortSelect.value;

            if (sort === "title-asc") {
                sorted.sort((a, b) => getTitle(a).localeCompare(getTitle(b)));
            } else if (sort === "title-desc") {
                sorted.sort((a, b) => getTitle(b).localeCompare(getTitle(a)));
            }

            return sorted;
        }

        async function loadCatalog(page = 1) {
            const requestId = ++catalogRequestId;
            const query = searchInput.value.trim();

            currentPage = Math.max(1, page);
            animeGrid.innerHTML = '<div class="status-panel">loading anime...</div>';
            resultCount.textContent = "loading...";
            pageNumber.textContent = `page ${currentPage}`;
            prevButton.disabled = currentPage <= 1;
            nextButton.disabled = true;
            pagination.classList.remove("hidden");

            try {
                const data = await fetchGraphQL(SEARCH_QUERY, {
                    page: currentPage,
                    perPage: PER_PAGE,
                    search: query || null
                });

                if (requestId !== catalogRequestId) return;

                const pageData = data?.Page;
                if (!pageData || !Array.isArray(pageData.media)) {
                    throw new Error("AniList returned an unexpected catalogue response.");
                }

                currentAnime = pageData.media.filter(isSuitable);
                hasNextPage = Boolean(pageData.pageInfo?.hasNextPage);

                currentAnime.forEach(anime => {
                    mediaCache.set(String(anime.id), anime);
                });

                renderCatalog();

                const countText = `${currentAnime.length} title${currentAnime.length === 1 ? "" : "s"} shown`;
                resultCount.textContent = query
                    ? `${countText} for “${query}”`
                    : countText;

                pageNumber.textContent = query
                    ? `search · page ${currentPage}`
                    : `page ${currentPage}`;

                prevButton.disabled = currentPage <= 1;
                nextButton.disabled = !hasNextPage;
            } catch (error) {
                if (requestId !== catalogRequestId) return;

                console.error("AniList catalogue error:", error);
                animeGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>couldn't load the catalogue.</h3>
                        <p>${escapeHTML(error.message || "something went wrong.")}</p>
                        <br>
                        <button class="action-button primary" id="retryButton">try again →</button>
                    </div>
                `;
                document.getElementById("retryButton")
                    ?.addEventListener("click", () => loadCatalog(currentPage));
                resultCount.textContent = "catalogue unavailable";
                nextButton.disabled = true;
            }
        }

        function renderCatalog() {
            const query = searchInput.value.trim();
            const list = getSortedAnime(currentAnime);

            animeGrid.innerHTML = "";

            if (list.length === 0) {
                animeGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>${query ? "no matches found." : "nothing here yet."}</h3>
                        <p>${query
                            ? "try another title or alternate spelling."
                            : "try again in a moment, or browse another page."}</p>
                    </div>
                `;
                return;
            }

            animeGrid.innerHTML = list.map((anime, index) => {
                const id = getAnimeId(anime);
                const title = getTitle(anime);
                const poster = getPoster(anime);
                const type = String(firstValue(anime?.format, "anime"));
                const score = Number(anime?.averageScore);
                const imageMarkup = poster ? `
                    <img
                        src="${escapeHTML(poster)}"
                        alt="${escapeHTML(title)}"
                        loading="${index < 10 ? "eager" : "lazy"}"
                        referrerpolicy="no-referrer"
                    >
                ` : "";

                return `
                    <button
                        class="anime-card"
                        type="button"
                        data-anime-id="${escapeHTML(id)}"
                        aria-label="view ${escapeHTML(title)}"
                    >
                        <div class="poster">
                            ${imageMarkup}
                            <div class="poster-placeholder ${poster ? "hidden" : ""}">
                                <span class="placeholder-mark">${escapeHTML(title.charAt(0).toLowerCase() || "a")}</span>
                                <span class="placeholder-title">${escapeHTML(title)}</span>
                            </div>
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${escapeHTML(title)}</h3>
                            <div class="card-meta">
                                <span class="tag live">${escapeHTML(type)}</span>
                                ${Number.isFinite(score) && score > 0
                                    ? `<span class="tag alpha">${(score / 10).toFixed(1)}/10</span>`
                                    : ""}
                            </div>
                        </div>
                    </button>
                `;
            }).join("");

            animeGrid.querySelectorAll(".anime-card").forEach(card => {
                const image = card.querySelector(".poster img");

                if (image) {
                    image.addEventListener("error", () => {
                        image.remove();
                        card.querySelector(".poster-placeholder")?.classList.remove("hidden");
                    }, { once: true });
                }

                card.addEventListener("click", () => {
                    const id = card.dataset.animeId;
                    if (id) openSeries(id);
                });
            });
        }

        async function openSeries(id) {
            const requestId = ++detailRequestId;
            lastOpenedSeriesId = id;

            catalogView.classList.add("hidden");
            detailView.classList.remove("hidden");
            detailContent.innerHTML = '<div class="status-panel">loading series details...</div>';

            selectedSeries = null;
            selectedEpisode = null;
            selectedLanguage = "sub";
            window.scrollTo({ top: 0, behavior: "smooth" });

            try {
                let series = mediaCache.get(String(id));

                if (!series) {
                    const data = await fetchGraphQL(DETAIL_QUERY, { id: Number(id) });
                    series = data?.Media;
                } else {
                    // Refresh the selected item so the detail view has a complete record.
                    const data = await fetchGraphQL(DETAIL_QUERY, { id: Number(id) });
                    series = data?.Media || series;
                }

                if (requestId !== detailRequestId) return;

                if (!series || !isSuitable(series)) {
                    throw new Error("This title is unavailable or doesn't meet the content filter.");
                }

                selectedSeries = series;
                mediaCache.set(String(series.id), series);
                renderSeries();
            } catch (error) {
                if (requestId !== detailRequestId) return;

                console.error("AniList series error:", error);
                detailContent.innerHTML = `
                    <div class="empty-state">
                        <h3>couldn't load this series.</h3>
                        <p>${escapeHTML(error.message || "something went wrong.")}</p>
                        <br>
                        <button class="action-button primary" id="retrySeries">try again →</button>
                    </div>
                `;
                document.getElementById("retrySeries")
                    ?.addEventListener("click", () => openSeries(id));
            }
        }

        function getEmbedURL(episodeNumber, language) {
            const malId = getMalId(selectedSeries);
            const number = Number(episodeNumber);

            if (!malId || !Number.isInteger(number) || number < 1) return "";

            return `${MEGAPLAY_BASE}/${malId}/${number}/${language}`;
        }

        function renderSeries() {
            const series = selectedSeries;
            if (!series) return;

            const title = getTitle(series);
            const poster = getPoster(series);
            const genres = getGenres(series);
            const episodes = makeEpisodes(series);
            const malId = getMalId(series);
            const score = Number(series.averageScore);
            const description = getDescription(series);

            const posterMarkup = poster
                ? `<img src="${escapeHTML(poster)}" alt="${escapeHTML(title)}" referrerpolicy="no-referrer">`
                : "";

            detailContent.innerHTML = `
                <div class="detail-layout">
                    <div class="detail-poster">
                        ${posterMarkup}
                        <div class="poster-placeholder ${poster ? "hidden" : ""}">
                            <span class="placeholder-mark">${escapeHTML(title.charAt(0).toLowerCase() || "a")}</span>
                            <span class="placeholder-title">${escapeHTML(title)}</span>
                        </div>
                    </div>

                    <div class="detail-copy">
                        <p class="eyebrow">series details</p>
                        <h1>${escapeHTML(title)}</h1>

                        <div class="detail-tags">
                            ${series.format ? `<span class="tag live">${escapeHTML(series.format)}</span>` : ""}
                            ${Number.isFinite(score) && score > 0
                                ? `<span class="tag alpha">${(score / 10).toFixed(1)}/10</span>`
                                : ""}
                            ${episodes.length
                                ? `<span class="tag soon">${episodes.length} episodes listed</span>`
                                : ""}
                            ${genres.map(genre =>
                                `<span class="tag soon">${escapeHTML(genre)}</span>`
                            ).join("")}
                        </div>

                        <p class="detail-description">${escapeHTML(description)}</p>
                        ${!malId ? `
                            <p class="player-note">
                                This title doesn't have a MAL ID in AniList, so the MAL-based player can't identify it.
                            </p>
                        ` : ""}
                    </div>
                </div>

                <section class="detail-section">
                    <p class="catalog-heading">the collection</p>
                    <h2>episodes</h2>
                    <div id="episodeList" class="episode-list"></div>
                </section>

                <section id="playerPanel" class="player-panel">
                    <div class="player-header">
                        <h2 id="playerTitle">choose an episode</h2>
                        <div class="language-controls">
                            <button class="language-button active" data-language="sub" type="button">sub</button>
                            <button class="language-button" data-language="dub" type="button">dub</button>
                        </div>
                    </div>

                    <div id="videoFrame" class="video-frame">
                        <div class="video-placeholder">choose an episode to begin.</div>
                    </div>

                    <p class="player-note">
                        Playback uses the show's MAL ID and episode number. Availability can vary by title and language.
                    </p>
                </section>
            `;

            const episodeList = document.getElementById("episodeList");

            if (episodes.length === 0) {
                episodeList.innerHTML = `
                    <div class="empty-state">
                        AniList doesn't list an episode count for this title, so episode buttons can't be generated automatically.
                    </div>
                `;
            } else {
                episodeList.innerHTML = episodes.map((episode, index) => `
                    <button
                        class="episode-button"
                        type="button"
                        data-episode-index="${index}"
                    >
                        <span class="episode-number">episode ${episode.number}</span>
                        <span class="episode-title">${escapeHTML(episode.title)}</span>
                    </button>
                `).join("");

                episodeList.querySelectorAll(".episode-button").forEach(button => {
                    button.addEventListener("click", () => {
                        const index = Number(button.dataset.episodeIndex);
                        selectEpisode(episodes[index], index);
                    });
                });
            }

            const detailPosterImage = detailContent.querySelector(".detail-poster img");
            if (detailPosterImage) {
                detailPosterImage.addEventListener("error", () => {
                    detailPosterImage.remove();
                    detailContent.querySelector(".detail-poster .poster-placeholder")
                        ?.classList.remove("hidden");
                }, { once: true });
            }

            detailContent.querySelectorAll(".language-button").forEach(button => {
                button.addEventListener("click", () => {
                    selectedLanguage = button.dataset.language;

                    detailContent.querySelectorAll(".language-button").forEach(item => {
                        item.classList.toggle(
                            "active",
                            item.dataset.language === selectedLanguage
                        );
                    });

                    if (selectedEpisode) {
                        playEpisode(selectedEpisode.episode, selectedEpisode.index);
                    }
                });
            });
        }

        function selectEpisode(episode, index) {
            selectedEpisode = { episode, index };

            document.querySelectorAll(".episode-button").forEach(button => {
                button.classList.toggle(
                    "active",
                    Number(button.dataset.episodeIndex) === index
                );
            });

            playEpisode(episode, index);
        }

        function playEpisode(episode, index) {
            const number = Number(episode?.number || index + 1);
            const url = getEmbedURL(number, selectedLanguage);
            const title = getTitle(selectedSeries);
            const playerTitle = document.getElementById("playerTitle");
            const videoFrame = document.getElementById("videoFrame");

            playerTitle.textContent = `${title} — episode ${number}`;

            if (!getMalId(selectedSeries)) {
                videoFrame.innerHTML = `
                    <div class="video-placeholder">
                        no MAL ID is available for this title, so the player can't build an episode link.
                    </div>
                `;
                return;
            }

            if (!url) {
                videoFrame.innerHTML = `
                    <div class="video-placeholder">
                        couldn't create the episode link. please choose another episode.
                    </div>
                `;
                return;
            }

            // The URL is built locally from a fixed trusted host and numeric values.
            const parsed = new URL(url);
            if (
                parsed.protocol !== "https:" ||
                parsed.hostname !== "megaplay.buzz"
            ) {
                videoFrame.innerHTML = `
                    <div class="video-placeholder">the video link isn't supported.</div>
                `;
                return;
            }

            videoFrame.innerHTML = `
                <iframe
                    src="${escapeHTML(parsed.href)}"
                    title="${escapeHTML(playerTitle.textContent)}"
                    allow="autoplay; fullscreen; picture-in-picture"
                    allowfullscreen
                    referrerpolicy="strict-origin-when-cross-origin"
                ></iframe>
            `;

            document.getElementById("playerPanel")
                .scrollIntoView({ behavior: "smooth", block: "start" });
        }

        prevButton.addEventListener("click", () => {
            if (currentPage > 1) {
                loadCatalog(currentPage - 1);
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        });

        nextButton.addEventListener("click", () => {
            if (hasNextPage) {
                loadCatalog(currentPage + 1);
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        });

        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => loadCatalog(1), SEARCH_DEBOUNCE_MS);
        });

        sortSelect.addEventListener("change", renderCatalog);

        document.getElementById("backToCatalog").addEventListener("click", () => {
            detailRequestId++;
            detailView.classList.add("hidden");
            catalogView.classList.remove("hidden");
            selectedSeries = null;
            selectedEpisode = null;
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        loadCatalog(1);
    </script>
</body>
</html>
